<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – page not found · Nina Mondočková</title>
<link rel="icon" type="image/png" href="/portfolio/image/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2147E6;--pink:#FF3DA5;--dark:#0b0b0e;--paper:#f4f4f6}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Inter Tight',system-ui,sans-serif;color:#fff;display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden;
    background:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px) 0 0/56px 56px,var(--blue)}
  .card{position:relative;background:var(--paper);color:var(--dark);border-radius:24px;padding:clamp(34px,6vw,64px) clamp(28px,6vw,72px);max-width:620px;rotate:-2deg;box-shadow:0 30px 60px rgba(0,0,0,.3);animation:drop .9s cubic-bezier(.3,1.5,.5,1)}
  .card::before,.card::after{content:'';position:absolute;top:-14px;width:30px;height:30px;border-radius:50%;background:var(--pink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.15),2px 4px 6px rgba(0,0,0,.3)}
  .card::before{left:28px}.card::after{right:28px;top:auto;bottom:-14px;opacity:0}
  .num{font-weight:800;font-size:clamp(110px,22vw,200px);letter-spacing:-.07em;line-height:.85;color:var(--blue)}
  .num span{display:inline-block;color:var(--blue);animation:wob 2.4s ease-in-out infinite}
  h1{font-weight:800;font-size:clamp(24px,4vw,36px);letter-spacing:-.04em;margin:18px 0 8px}
  p{font-size:16px;color:#444;line-height:1.5}
  .note{font-family:'Caveat',cursive;font-size:24px;color:var(--blue);margin-top:14px;rotate:-3deg}
  a.home{display:inline-block;margin-top:26px;padding:13px 26px;border-radius:99px;background:var(--dark);color:#fff;text-decoration:none;font-weight:800;font-size:14px;letter-spacing:.04em;transition:background .25s,transform .4s cubic-bezier(.3,1.7,.5,1)}
  a.home:hover{background:var(--pink);transform:rotate(-4deg) scale(1.05)}
  .clip{position:absolute;top:-30px;right:46px;width:26px;height:64px;rotate:10deg}
  @keyframes drop{from{opacity:0;translate:0 -60px;rotate:-12deg}to{opacity:1;translate:0 0;rotate:-2deg}}
  @keyframes wob{0%,100%{rotate:0deg}50%{rotate:-12deg}}
  @media (prefers-reduced-motion:reduce){.card,.num span{animation:none}}
</style>
</head>
<body>
  <main class="card">
    <svg class="clip" viewBox="0 0 24 60" aria-hidden="true"><path d="M8 18V44a4 4 0 0 0 8 0V12a6 6 0 0 0-12 0V46a8 8 0 0 0 16 0V20" fill="none" stroke="#9aa0ab" stroke-width="2.6" stroke-linecap="round"/></svg>
    <div class="num">4<span>0</span>4</div>
    <h1 id="h">This page got lost in the folders.</h1>
    <p id="p">The page you are looking for doesn't exist or has been moved.</p>
    <a class="home" id="a" href="/portfolio/">← BACK TO PORTFOLIO</a>
  </main>
<script>
  // jazyk podľa prehliadača (SK / DK / EN)
  var l = (navigator.language || 'en').slice(0, 2), T = {
    sk: ['Táto stránka sa stratila medzi šanónmi.', 'Stránka, ktorú hľadáš, neexistuje alebo bola presunutá.', 'možno spadla za stôl…', '← SPÄŤ NA PORTFÓLIO'],
    da: ['Denne side er blevet væk i mapperne.', 'Siden, du leder efter, findes ikke eller er blevet flyttet.', 'måske faldt den bag skrivebordet…', '← TILBAGE TIL PORTEFØLJEN']
  }[l === 'cs' ? 'sk' : l];
  if (T) { h.textContent = T[0]; p.textContent = T[1]; a.textContent = T[3]; document.documentElement.lang = l; }
  if (location.protocol === 'file:') a.href = 'index.html';
</script>
</body>
</html>
